name: Import ORAMA assets

on:
  push:
    paths:
      - "imports/**/*.b64"
      - "imports/**/*.url"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import assets
        shell: bash
        run: |
          shopt -s globstar nullglob
          base64_files=(imports/**/*.b64)
          for src in "${base64_files[@]}"; do
            rel="${src#imports/}"
            dest="${rel%.b64}"
            mkdir -p "$(dirname "$dest")"
            base64 --decode "$src" > "$dest"
            rm "$src"
          done
          url_files=(imports/**/*.url)
          for src in "${url_files[@]}"; do
            rel="${src#imports/}"
            dest="${rel%.url}"
            mkdir -p "$(dirname "$dest")"
            url="$(cat "$src")"
            curl --fail --location --silent --show-error --retry 3 "$url" --output "$dest"
            test -s "$dest"
            rm "$src"
          done
      - name: Commit imported assets
        shell: bash
        run: |
          git config user.name "ORAMA Asset Bot"
          git config user.email "fervalenzuela@varih.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import ORAMA social assets"
          git push
